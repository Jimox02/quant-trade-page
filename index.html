<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant V3 · 日线模拟账户</title>
<style>body{margin:0;background:#0d1422;color:#e4ebf5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px}h1{font-size:28px}small,p{color:#a9b7cc}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{padding:24px;background:#19253a;border-radius:12px;min-width:180px}.value{font-size:28px;margin-top:10px}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{text-align:left;padding:12px;border-bottom:1px solid #28364d}.scroll{overflow:auto}select{padding:10px}svg{width:100%;height:180px}#error{color:#ffb7a9}</style>
<main><h1>Quant V3 · 日线模拟账户</h1><p>收盘后更新 · 日线保守成交假设 · 非实盘交易</p><p id="stamp">正在加载…</p><p id="error"></p><div class="cards" id="cards"></div><svg id="curve" viewBox="0 0 1000 180" role="img" aria-label="已结算账户净值"></svg><h2>每日结算</h2><div class="scroll"><table><thead><tr><th>日期</th><th>净资产</th><th>现金</th><th>累计收益</th><th>成交笔数</th></tr></thead><tbody id="days"></tbody></table></div><h2>历史明细</h2><select id="date"></select><h3>持仓批次</h3><div class="scroll" id="positions"></div><h3>成交记录</h3><div class="scroll" id="fills"></div></main>
<script>
const el=id=>document.getElementById(id),money=x=>Number(x).toLocaleString('zh-CN',{maximumFractionDigits:2}),pct=x=>(x*100).toFixed(2)+'%';
function table(target,rows,columns){const t=document.createElement('table'),head=t.createTHead().insertRow();columns.forEach(([key,label])=>{const c=document.createElement('th');c.textContent=label;head.append(c)});const body=t.createTBody();rows.forEach(r=>{const row=body.insertRow();columns.forEach(([key])=>row.insertCell().textContent=r[key]??'—')});el(target).replaceChildren(t);if(!rows.length)el(target).textContent='无记录'}
fetch('./results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('结果文件暂不可用');return r.json()}).then(data=>{
el('stamp').textContent=`生成时间：${new Date(data.generated_at).toLocaleString('zh-CN')} · 最近任务：${data.status} · 最后结算：${data.sessions.at(-1)?.date??'尚未结算'}`;
if(data.status!=='PASS')el('error').textContent='最近任务未成功完成；以下保留已提交的历史结果，不代表今日已结算。';
const last=data.sessions.at(-1);[['净资产',last?money(last.equity):'尚未结算'],['累计收益',last?pct(last.total_return):'—'],['已结算交易日',data.sessions.length]].forEach(([label,value])=>{const card=document.createElement('div');card.className='card';const name=document.createElement('div');name.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=value;card.append(name,v);el('cards').append(card)});
data.sessions.slice().reverse().forEach(s=>{const row=document.createElement('tr');[s.date,money(s.equity),money(s.cash),pct(s.total_return),s.fills.length].forEach(v=>{const c=document.createElement('td');c.textContent=v;row.append(c)});el('days').append(row);const option=document.createElement('option');option.value=s.date;option.textContent=s.date;el('date').append(option)});
function detail(){const s=data.sessions.find(s=>s.date===el('date').value);if(!s)return;table('positions',s.positions,[['symbol','证券'],['quantity','数量'],['cost','成本'],['sellable_date','可卖日期']]);table('fills',s.fills,[['symbol','证券'],['side','方向'],['quantity','数量'],['price','成交价'],['cost','费用']])}el('date').onchange=detail;detail();
if(data.sessions.length>1){const values=data.sessions.map(s=>s.equity),lo=Math.min(...values),span=Math.max(...values)-lo||1;const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',values.map((v,i)=>`${20+i*960/(values.length-1)},${160-(v-lo)/span*140}`).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#6dd8c3');line.setAttribute('stroke-width','3');el('curve').append(line)}
}).catch(e=>{el('stamp').textContent='加载失败';el('error').textContent=e.message});
</script></html>
