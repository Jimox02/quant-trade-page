<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant V3 · 日线模拟账户</title>
<style>body{margin:0;background:#0d1422;color:#e4ebf5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px}h1{font-size:28px}small,p{color:#a9b7cc}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{padding:24px;background:#19253a;border-radius:12px;min-width:180px}.value{font-size:28px;margin-top:10px}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{text-align:left;padding:12px;border-bottom:1px solid #28364d}.scroll{overflow:auto}select{padding:10px}svg{width:100%;height:180px}#error{color:#ffb7a9}</style>
<style>
body{background:radial-gradient(ellipse at 90% 0,#173549 0,transparent 45%),#0b1120;font-family:Inter,'Microsoft YaHei',system-ui}main{max-width:1200px;padding:36px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.eyebrow{font-size:12px;letter-spacing:3px;color:#60d8bd}h1{margin:10px 0;font-size:30px;letter-spacing:1px}.clock{border:1px solid #30435a;border-radius:14px;padding:14px 20px;text-align:right;background:#122035}.clock small{font-size:12px}.clock time{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:5px}#stamp{display:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:24px}.card{min-width:0;border:1px solid #2c3b51;background:linear-gradient(140deg,#1b2c43,#111d30);box-shadow:0 10px 32px #0002}.card:first-child .value{color:#6ee7c8}.value{font-size:32px;font-variant-numeric:tabular-nums}.chart-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.panel,.scroll{background:#111d2f;border:1px solid #28384d;border-radius:16px;padding:18px}.panel h2{font-size:16px;margin:0 0 8px}.panel svg{height:auto;min-height:180px}h2{font-size:20px;margin:30px 0 16px}h3{font-size:15px;color:#b6c6da;margin:24px 0 12px}table{font-size:14px;margin:0}th{font-weight:500;color:#8fa5be;font-size:12px}td{font-variant-numeric:tabular-nums}tbody tr:hover{background:#1a2d44}select{background:#1b2d43;color:#e4ebf5;border:1px solid #3a516c;border-radius:8px}#error:empty{display:none}@media(max-width:700px){main{padding:22px 16px}header{align-items:flex-start;flex-direction:column}.clock{text-align:left;width:calc(100% - 42px)}.cards,.chart-grid{grid-template-columns:1fr}.value{font-size:28px}h1{font-size:25px}}
</style>
<main><header><div><span class="eyebrow">QUANT / PORTFOLIO</span><h1>量化交易 · 账户总览</h1></div><div class="clock"><small>北京时间 · Asia/Shanghai</small><time id="clock"></time><small id="clock-date"></small></div></header><p id="stamp"></p><p id="error"></p><div class="cards" id="cards"></div><div class="chart-grid"><section class="panel"><h2>净资产走势</h2><svg id="curve" viewBox="0 0 1000 250" role="img" aria-label="已结算账户净值"></svg></section><section class="panel"><h2>每日盈亏 · 元</h2><svg id="pnl" viewBox="0 0 600 250" role="img" aria-label="每日盈亏"></svg></section></div><h2>每日结算</h2><div class="scroll"><table><thead><tr><th>日期</th><th>净资产</th><th>现金</th><th>累计收益</th><th>成交笔数</th></tr></thead><tbody id="days"></tbody></table></div><h2>历史明细</h2><select id="date"></select><h3>持仓批次</h3><div class="scroll" id="positions"></div><h3>成交记录</h3><div class="scroll" id="fills"></div></main>
<script>
const el=id=>document.getElementById(id),money=x=>Number(x).toLocaleString('zh-CN',{maximumFractionDigits:2}),pct=x=>(x*100).toFixed(2)+'%';
function clock(){const now=new Date();el('clock').textContent=now.toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});el('clock-date').textContent=now.toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'long'})}clock();setInterval(clock,1000);
function svgNode(parent,tag,attrs,text){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;parent.append(n);return n}
function table(target,rows,columns){const t=document.createElement('table'),head=t.createTHead().insertRow();columns.forEach(([key,label])=>{const c=document.createElement('th');c.textContent=label;head.append(c)});const body=t.createTBody();rows.forEach(r=>{const row=body.insertRow();columns.forEach(([key])=>row.insertCell().textContent=(key==='symbol'?(r.symbol||r.ts_code):r[key])??'—')});el(target).replaceChildren(t);if(!rows.length)el(target).textContent='无记录'}
fetch('./results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('结果文件暂不可用');return r.json()}).then(data=>{
if(data.status!=='PASS')el('error').textContent='最近任务未成功完成；以下保留已提交的历史结果，不代表今日已结算。';
const last=data.sessions.at(-1);[['净资产',last?money(last.equity):'尚未结算'],['累计收益',last?pct(last.total_return):'—'],['已结算交易日',data.sessions.length]].forEach(([label,value])=>{const card=document.createElement('div');card.className='card';const name=document.createElement('div');name.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=value;card.append(name,v);el('cards').append(card)});
data.sessions.slice().reverse().forEach(s=>{const row=document.createElement('tr');[s.date,money(s.equity),money(s.cash),pct(s.total_return),s.fills.length].forEach(v=>{const c=document.createElement('td');c.textContent=v;row.append(c)});el('days').append(row);const option=document.createElement('option');option.value=s.date;option.textContent=s.date;el('date').append(option)});
function detail(){const s=data.sessions.find(s=>s.date===el('date').value);if(!s)return;table('positions',s.positions,[['symbol','证券'],['quantity','数量'],['cost','成本'],['sellable_date','可卖日期']]);table('fills',s.fills,[['symbol','证券'],['side','方向'],['quantity','数量'],['price','成交价'],['cost','费用']])}el('date').onchange=detail;detail();
const values=data.sessions.map(s=>s.equity),chart=el('curve');
if(!values.length){svgNode(chart,'text',{x:400,y:125,fill:'#91a6be'},'暂无已结算数据')}else{const lo=Math.min(...values),hi=Math.max(...values),padding=Math.max((hi-lo)*.15,Math.abs(lo)*.001,1),min=lo-padding,span=hi-lo+padding*2;for(let i=0;i<4;i++){const y=25+i*55;svgNode(chart,'line',{x1:100,y1:y,x2:970,y2:y,stroke:'#29394f'});svgNode(chart,'text',{x:4,y:y+5,fill:'#8fa5be','font-size':16},money(min+span*(1-i/3)))}const pts=values.map((v,i)=>[values.length===1?535:100+i*870/(values.length-1),190-(v-min)/span*165]);if(pts.length>1)svgNode(chart,'polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#6dd8c3','stroke-width':3});pts.forEach(([x,y],i)=>{const dot=svgNode(chart,'circle',{cx:x,cy:y,r:5,fill:'#6dd8c3'});svgNode(dot,'title',{},`${data.sessions[i].date} 净资产 ${money(values[i])}`)});svgNode(chart,'text',{x:100,y:230,fill:'#8fa5be','font-size':17},data.sessions[0].date);if(values.length>1)svgNode(chart,'text',{x:970,y:230,fill:'#8fa5be','text-anchor':'end','font-size':17},last.date)}
const pnl=el('pnl'),profits=data.sessions.map((s,i)=>s.equity-(i?data.sessions[i-1].equity:data.initial_cash)),scale=Math.max(1,...profits.map(Math.abs));svgNode(pnl,'line',{x1:25,y1:115,x2:580,y2:115,stroke:'#526580'});if(!profits.length)svgNode(pnl,'text',{x:200,y:90,fill:'#91a6be'},'暂无已结算数据');profits.forEach((v,i)=>{const x=35+i*540/profits.length,w=Math.min(70,400/profits.length),h=Math.abs(v)/scale*75;const bar=svgNode(pnl,'rect',{x,y:v>=0?115-h:115,width:w,height:Math.max(h,1),rx:3,fill:v>=0?'#6dd8c3':'#f497a0'});svgNode(bar,'title',{},`${data.sessions[i].date} ${money(v)} 元`);if(profits.length<=8){svgNode(pnl,'text',{x,y:v>=0?105-h:135+h,fill:'#b7c8dc','font-size':14},money(v));svgNode(pnl,'text',{x,y:230,fill:'#8fa5be','font-size':13},data.sessions[i].date.slice(5))}});
}).catch(e=>{el('stamp').textContent='加载失败';el('error').textContent=e.message});
</script></html>
